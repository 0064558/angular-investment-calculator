<form (ngSubmit)="onSubmit()">
    <div class="input-group">
        <p>
            <label for="initial-investment">Investimento Inicial: </label>
            <input id="inicial-investment" name="initial-investment" type="number" [(ngModel)]="enteredInitialInvestment" />
        </p>

        <p>
            <label for="annual-investment">Investimento Anual: </label>
            <input id="annual-investment" name="annual-investment" type="number" [(ngModel)]="enteredAnnualInvestment" />
        </p>
    </div>

    <div class="input-group">
        <p>
            <label for="expected-investment">Retorno Esperado: </label>
            <input id="expected-investment" name="expected-investment" type="number" [(ngModel)]="enteredExpectedInvestment" />
        </p>

        <p>
            <label for="duration">Duração: </label>
            <input id="duration" name="duration" type="number" [(ngModel)]="enteredDuration" />
        </p>
    </div>
    <p><button type="submit">Calcular</button></p>
</form>
